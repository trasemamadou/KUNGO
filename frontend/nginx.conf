server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Ne jamais mettre en cache le point d'entrée SPA ni la config runtime.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location = /env.js {
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Fallback SPA : toute route inconnue est servie par index.html (Angular Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
