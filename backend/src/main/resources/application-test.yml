spring:
  datasource:
    url: jdbc:h2:mem:kungo_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6399
  cache:
    type: simple
  mail:
    host: localhost
    port: 3025

app:
  jwt:
    secret: test_secret_key_for_unit_tests_only_min_256_bits_kungo
