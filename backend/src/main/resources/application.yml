spring:
  application:
    name: kungo-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    #url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kungo}
    #username: ${DB_USER:kungo}
    #password: ${DB_PASSWORD:kungo_dev_password}
    url: jdbc:postgresql://localhost:5432/kungo
    #url: jdbc:postgresql://82.25.116.63:5432/school_db1
    username: postgres
    password: Passer@123
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc.batch_size: 30
        order_inserts: true
        order_updates: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1
  error:
    include-message: always

app:
  jwt:
    secret: ${JWT_SECRET:change_me_in_prod_min_256_bits_secret_key_kungo_marketplace}
    access-token-expiration-ms: ${JWT_ACCESS_EXP:900000}      # 15 min
    refresh-token-expiration-ms: ${JWT_REFRESH_EXP:604800000} # 7 jours
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  mail:
    from: ${MAIL_FROM:no-reply@kungo.app}
    frontend-activation-url: ${FRONTEND_URL:http://localhost:4200}/auth/activate
    frontend-reset-password-url: ${FRONTEND_URL:http://localhost:4200}/auth/reset-password
  commission:
    default-percentage: 12.0
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  payment:
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"
  level:
    com.kungo: INFO
    org.hibernate.SQL: WARN
